<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control Remoto TV</title>
  <link rel="stylesheet" href="remote.css">
</head>
<body>
  <div class="remote-wrapper">
    <!-- Barra Superior de Estado -->
    <header class="remote-header">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span id="connection-status">Conectado a la TV</span>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn-top-action" id="btn-power" title="Inicio / Home">🏠</button>
        <button class="btn-top-action btn-exit-top" id="btn-exit-app" title="Cerrar / Apagar Smart TV">🛑 Salir</button>
      </div>
    </header>

    <!-- Buscador de Teclado Rápido para TV -->
    <section class="search-section">
      <div class="search-input-group">
        <input type="text" id="tv-search-input" placeholder="Buscar video o anime..." />
        <button id="btn-tv-search" class="btn-search-action">🔍</button>
      </div>
    </section>

    <!-- Accesos Directos a Apps -->
    <section class="app-shortcuts">
      <button class="btn-app youtube" data-app="youtube">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="#ff0000" style="vertical-align: middle;"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        YouTube
      </button>
      <button class="btn-app crunchyroll" data-app="crunchyroll">
        <img src="/crunchyroll-icon.png" alt="Crunchyroll" style="width: 18px; height: 18px; border-radius: 4px; vertical-align: middle;" />
        Crunchyroll
      </button>
      <button class="btn-app local" data-app="local_video">📁 Videos</button>
      <button class="btn-app turbo" data-app="turbo_ram">⚡ Turbo</button>
    </section>

    <!-- Pestañas: Control Clásico D-Pad vs Touchpad Virtual -->
    <div class="mode-tabs">
      <button class="tab-btn active" id="tab-dpad">Control D-Pad</button>
      <button class="tab-btn" id="tab-touchpad">Touchpad Ratón</button>
    </div>

    <!-- MODO 1: D-PAD CLÁSICO DE SALA -->
    <section id="panel-dpad" class="panel-mode active">
      <div class="dpad-container">
        <button class="dpad-btn dpad-up" data-key="up">▲</button>
        <button class="dpad-btn dpad-left" data-key="left">◀</button>
        <button class="dpad-btn dpad-ok" data-key="ok">OK</button>
        <button class="dpad-btn dpad-right" data-key="right">▶</button>
        <button class="dpad-btn dpad-down" data-key="down">▼</button>
      </div>

      <!-- Fila de Navegación (Atrás / Home / Play) -->
      <div class="nav-row">
        <button class="btn-nav" id="btn-back">↩️ Atrás</button>
        <button class="btn-nav" id="btn-home">🏠 Inicio</button>
        <button class="btn-nav" id="btn-playpause">⏯️ Play/Pausa</button>
      </div>

      <!-- Fila de Control de Volumen -->
      <div class="vol-row">
        <button class="btn-vol" id="btn-vol-down">🔉 Vol -</button>
        <button class="btn-vol" id="btn-vol-mute">🔇 Silencio</button>
        <button class="btn-vol" id="btn-vol-up">🔊 Vol +</button>
      </div>
    </section>

    <!-- MODO 2: TOUCHPAD TÁCTIL (RATÓN EN PANTALLA) -->
    <section id="panel-touchpad" class="panel-mode">
      <!-- Barra Rápida de Salida y Navegación para Crunchyroll y Web -->
      <div class="touchpad-quick-bar">
        <button class="btn-touch-action back" id="btn-touch-back">↩️ Atrás</button>
        <button class="btn-touch-action home" id="btn-touch-home">🏠 Menú TV</button>
      </div>

      <div id="touchpad-surface" class="touchpad-surface">
        <div class="touchpad-hint">
          <span>👆 1 dedo: mover • ✌️ 2 dedos: deslizar</span>
          <small>Toque rápido: hacer clic</small>
        </div>
      </div>

      <!-- Botones de scroll directo -->
      <div class="scroll-buttons-row">
        <button class="btn-scroll" id="btn-scroll-up">🔼 Subir Página</button>
        <button class="btn-scroll" id="btn-scroll-down">🔽 Bajar Página</button>
      </div>
      
      <div class="type-sender-box">
        <input type="text" id="type-text-input" placeholder="Escribir correo o contraseña..." />
        <button id="btn-send-text" class="btn-type-send">⌨️ Enviar a TV</button>
      </div>

      <div class="touchpad-buttons">
        <button class="btn-click" id="btn-touch-click">Clic Principal</button>
      </div>
    </section>
  </div>

  <script src="remote.js"></script>
</body>
</html>
